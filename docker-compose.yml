services:
  postgres:
    image: postgres:16-alpine
    container_name: bowling-machine-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: bowling
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: bowling_machine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bowling -d bowling_machine']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
